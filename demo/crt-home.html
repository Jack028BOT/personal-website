<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="冯建燊 · 广东工业大学电子商务专业 2028 届 · 新媒体运营 / 内容运营。运营小红书「pre灵感集」一年，63 篇笔记、累计赞藏 1.4W、单篇最高 7500+。">
<meta name="theme-color" content="#EDF5FF">
<title>冯建燊 · PORTFOLIO · 新媒体运营</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600;700&family=Inter:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============ 变量 ============ */
:root{
  /* 页面 */
  --page-bg:#F8FAFD; --page-dot:#E4EAF2;
  --ink:#0B1220; --ink-2:#47607A; --ink-3:#7A8CA0; --hairline:#E7EDF4;
  /* 蓝色面板 */
  --panel-1:#EDF5FF; --panel-2:#DCEBFC; --panel-3:#C6DCF4;
  --panel-shadow:0 24px 60px -22px rgba(19,66,116,.38), 0 2px 0 rgba(255,255,255,.55);
  /* 电视机身蓝三阶 */
  --tv-hi:#63B4F7; --tv-mid:#2E8BE0; --tv-low:#1B67B8; --tv-deep:#10477F;
  --tv-top:#A9DBFA; --tv-face:#4FA3EE; --tv-side:#1E6FC4;
  /* 屏幕 */
  --screen:#0A0E14; --halftone:#FFFFFF;
  /* 点缀 */
  --amber:#FFB020; --amber-mid:#E8890F; --amber-deep:#C96E08;
  --sticky:#FFD93B; --sticky-deep:#F2C200; --sticky-ink:#7A5B00;
  --cyan:#22D3EE; --cyan-mid:#0EA5C4; --cyan-hi:#67E8F9;
  --red:#E63B2E; --red-hi:#FF6B5A;
  --blue-deep:#144E86; --shadow:rgba(19,66,116,.28);
  /* 字体 */
  --f-display:'Archivo Black','Arial Black','Noto Sans SC',sans-serif;
  --f-body:'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --f-hand:'Caveat','Segoe Script','Noto Sans SC',cursive;
  /* 尺寸 */
  --nav-h:56px; --panel-max:1120px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--f-body);color:var(--ink);background:var(--page-bg);
  background-image:radial-gradient(circle,var(--page-dot) 1px,transparent 1.1px);
  background-size:22px 22px;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
svg{display:block;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
a{color:inherit;text-decoration:none;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.skip-link{position:absolute;left:12px;top:-60px;z-index:200;background:#0B1220;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;transition:top .18s;}
.skip-link:focus{top:12px;}
:focus-visible{outline:3px solid #0B1220;outline-offset:3px;border-radius:4px;}

/* ============ 顶部导航 ============ */
.site-nav{
  position:sticky;top:0;z-index:60;height:var(--nav-h);
  background:rgba(255,255,255,.78);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;gap:16px;padding:0 clamp(12px,3vw,32px);
}
.brand{display:flex;align-items:center;gap:10px;flex:none;}
.brand-logo{
  width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--tv-hi),var(--tv-low));
  box-shadow:0 3px 0 var(--blue-deep);display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--f-display);font-size:15px;line-height:1;padding-bottom:2px;
}
.brand-name{font-size:15px;font-weight:900;letter-spacing:.5px;}
.brand-role{
  font-size:12px;color:var(--ink-3);border-left:1px solid var(--hairline);
  padding-left:10px;font-weight:500;
}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:auto;}
.nav-links a{
  font-size:13px;font-weight:700;color:var(--ink-2);padding:7px 11px;border-radius:8px;
  transition:background .15s,color .15s;
}
.nav-links a:hover{background:#EAF2FC;color:var(--tv-deep);}
.nav-cta{
  margin-left:10px;background:var(--tv-mid);color:#fff;font-size:13px;font-weight:700;
  padding:9px 18px;border-radius:10px;box-shadow:0 5px 0 var(--blue-deep);
  transition:transform .08s,box-shadow .08s;
}
.nav-cta:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--blue-deep);}
.nav-cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-deep);}
.nav-ext{display:none;}

/* ============ Hero 面板 ============ */
.hero-wrap{padding:clamp(14px,2.4vw,30px) clamp(10px,2.4vw,28px) clamp(40px,6vw,80px);}
.hero-panel{
  position:relative;max-width:var(--panel-max);margin:0 auto;overflow:hidden;
  border-radius:28px;padding:clamp(18px,3vw,40px);
  background:linear-gradient(135deg,var(--panel-1) 0%,var(--panel-2) 48%,var(--panel-3) 100%);
  box-shadow:var(--panel-shadow);
}
.tv-stage{
  position:relative;width:100%;aspect-ratio:900/620;
  perspective:1400px;perspective-origin:50% 42%;
  container-type:inline-size;--px:0;--py:0;
}
.scene{
  position:absolute;inset:0;transform-origin:50% 60%;
  transform:translate3d(calc(var(--px) * 22px),calc(var(--py) * 14px),0) rotateX(2deg) rotateY(-6deg);
}
.scene-art{width:100%;height:100%;}

/* ============ 屏幕巨字 ============ */
.tv-words{
  position:absolute;left:24.2%;top:27.1%;width:39.1%;height:38.7%;
  display:flex;align-items:center;
}
.tv-words-btn{
  width:100%;padding:0 0 0 14%;display:flex;flex-direction:column;justify-content:center;
  align-items:flex-start;line-height:.84;letter-spacing:-.02em;
  font-family:var(--f-display);color:#fff;
  font-size:clamp(24px,9vw,96px);font-size:11.4cqw;
  text-shadow:0 3px 10px rgba(0,0,0,.42);
}
.tv-line{display:block;transition:opacity .2s ease;}
.tv-words-btn.is-fading .tv-line{opacity:0;}

/* ============ 便利贴 / 名牌 / 便条（HTML 覆盖层） ============ */
.sticky-note{
  position:absolute;left:68%;top:22.5%;width:clamp(104px,14.5cqw,156px);
  transform:translate(-50%,-50%) rotate(-6deg);
  background:linear-gradient(160deg,var(--sticky),var(--sticky-deep));
  border-radius:3px;box-shadow:0 8px 16px rgba(19,66,116,.26);
  padding:9px 11px;color:var(--sticky-ink);transition:transform .22s,box-shadow .22s;
  z-index:6;
}
.sticky-note::after{
  content:"";position:absolute;right:0;bottom:0;border-width:0 0 12px 12px;
  border-style:solid;border-color:transparent transparent rgba(190,150,0,.35) transparent;
}
.sticky-note:hover{transform:translate(-50%,-50%) rotate(-10deg) translateY(-5px);box-shadow:0 14px 24px rgba(19,66,116,.3);}
.sticky-main{font-family:var(--f-hand);font-size:clamp(14px,2.4cqw,25px);font-weight:700;line-height:1.05;white-space:nowrap;}
.sticky-sub{font-size:clamp(8px,1.3cqw,13px);opacity:.78;margin-top:4px;letter-spacing:.5px;white-space:nowrap;}
.sticky-tail{
  position:absolute;left:0;right:0;top:100%;margin-top:6px;padding:6px 8px;border-radius:8px;
  background:rgba(11,18,32,.9);color:#fff;font-size:clamp(7px,1.7cqw,13px);font-weight:500;
  opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none;
}
.sticky-note:hover .sticky-tail{opacity:1;transform:translateY(0);}

.name-badge{
  position:absolute;left:18%;top:84.5%;width:19.1%;height:7.7%;
  transform:rotate(-2deg);border-radius:10px;
  background:linear-gradient(150deg,var(--tv-mid),var(--tv-low));
  border:2px solid var(--tv-deep);
  box-shadow:0 9px 0 rgba(16,71,127,.22),0 12px 20px rgba(19,66,116,.2);
  display:flex;align-items:center;justify-content:center;gap:6%;
  color:#fff;font-weight:900;letter-spacing:2px;
  font-size:clamp(10px,3.4cqw,28px);
  z-index:5;
}
.name-badge .pin{width:9%;aspect-ratio:1;border-radius:50%;background:var(--tv-hi);flex:none;}

.user-note{
  position:absolute;left:44%;top:78.9%;width:15%;height:4.9%;
  transform:rotate(-5deg);border-radius:4px;
  background:#FFFDF2;border:1px solid #E7DFC2;box-shadow:0 5px 10px rgba(19,66,116,.2);
  color:#3A3A3A;font-size:clamp(7px,1.5cqw,15px);font-weight:700;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:0 2%;z-index:4;white-space:nowrap;
}

/* ============ 漂浮 3D 物件 ============ */
.float{
  position:absolute;left:var(--x);top:var(--y);width:var(--w);
  animation:float-bob var(--dur) var(--delay) ease-in-out infinite;
  container-type:inline-size;z-index:8;
}
.float-par{position:relative;transform:translate3d(calc(var(--px) * var(--k) * 22px),calc(var(--py) * var(--k) * 14px),0);}
.float-tilt{
  transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--sc,1));
  transition:transform .25s cubic-bezier(.2,.8,.3,1.2);
}
.float:hover .float-tilt{transform:rotateX(0deg) rotateY(0deg) scale(calc(var(--sc,1) * 1.08));}
.float-shadow{
  position:absolute;left:14%;top:18%;width:78%;height:26%;
  background:rgba(19,66,116,.24);border-radius:50%;filter:blur(4px);
  animation:shadow-drift var(--dur) var(--delay) ease-in-out infinite;
  pointer-events:none;
}
.float svg{width:100%;height:auto;overflow:visible;}

/* 立方体 */
.float--cube{--x:11%;--y:5%;--w:11.5cqw;--amp:14px;--dur:5.5s;--delay:-.4s;--k:.38;--rx:6deg;--ry:-12deg;}
/* Ctrl 键帽 */
.float--ctrl{--x:12%;--y:40%;--w:11cqw;--amp:10px;--dur:4.2s;--delay:-1.8s;--k:.24;--rx:12deg;--ry:-18deg;}
/* CET-6 徽章 */
.float--badge{--x:5%;--y:62%;--w:11cqw;--amp:16px;--dur:6s;--delay:-2.6s;--k:.12;--rx:-8deg;--ry:10deg;}
/* 白色数据卡 1.4W */
.float--data{--x:auto;--y:5%;--w:10.4cqw;--amp:13px;--dur:4.8s;--delay:-.9s;--k:.24;--rx:8deg;--ry:14deg;right:17%;}
/* 迷你青色卡 7500+ */
.float--mini{--x:auto;--y:14%;--w:6.4cqw;--amp:9px;--dur:4.4s;--delay:-1.2s;--k:.12;--rx:10deg;--ry:16deg;right:6%;}
/* 青色图表磁贴 */
.float--chart{--x:auto;--y:41%;--w:9.4cqw;--amp:15px;--dur:5.2s;--delay:-3.1s;--k:.24;--rx:-6deg;--ry:-14deg;right:18%;}
/* 橙红播放药丸 */
.float--pill{--x:auto;--y:71%;--w:5.8cqw;--amp:11px;--dur:3.6s;--delay:-2.2s;--k:.12;--rx:-10deg;--ry:8deg;right:5%;}

/* 卡片通用样式 */
.tile{
  position:relative;border-radius:20px;padding:9% 8% 8%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:100%;border-radius:20px;background:inherit;transform:translateY(7%);z-index:-1;}
.tile--white{background:#fff;border:1px solid #E2EAF2;box-shadow:0 9px 0 rgba(19,66,116,.1);}
.tile--white::before{background:#E6EDF5;}
.tile--cyan{background:var(--cyan);box-shadow:0 9px 0 rgba(14,165,196,.45);}
.tile--cyan::before{background:var(--cyan-mid);}
.tile-fig{width:100%;height:auto;margin-bottom:6%;}
.tile-num{font-family:var(--f-display);color:#0B1220;line-height:1;letter-spacing:-.02em;}
.tile--cyan .tile-num{color:#fff;}
.tile-label{font-size:11cqw;color:#5B7189;margin-top:6%;font-weight:500;white-space:nowrap;}
.tile--cyan .tile-label{color:rgba(255,255,255,.92);}

/* 青色磁贴上的图表 */
.chart-svg{width:100%;height:auto;margin-bottom:8%;}
.chart-line{stroke-dasharray:120;stroke-dashoffset:0;}
.float--chart:hover .chart-line{animation:redraw 1.1s ease-out;}
@keyframes redraw{0%{stroke-dashoffset:120;}60%{stroke-dashoffset:0;}100%{stroke-dashoffset:0;}}

/* 跑酷小人步频 */
.fig-a{animation:step .5s steps(1) infinite;}
.fig-b{animation:step .5s steps(1) infinite;animation-delay:.25s;opacity:0;}
@keyframes step{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.float--data:hover .fig-a,.float--data:hover .fig-b{animation-duration:.3s;}

/* 键帽 hover 展开工具标签 */
.ctrl-cap{position:relative;}
.ctrl-tag{
  position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px);
  white-space:nowrap;background:rgba(11,18,32,.92);color:#fff;
  font-size:11px;font-weight:500;padding:6px 10px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.float--ctrl:hover .ctrl-tag{opacity:1;transform:translateX(-50%) translateY(0);}

/* 药丸 hover */
.pill-wrap{position:relative;}
.pill-tag{
  position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px);
  white-space:nowrap;background:rgba(11,18,32,.92);color:#fff;
  font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.float--pill:hover .pill-tag{opacity:1;transform:translateX(-50%) translateY(0);}

/* 立方体 hover 三面依次高亮 */
.cube-face{transition:filter .3s;}
.float--cube:hover .cube-top{filter:brightness(1.18);}
.float--cube:hover .cube-left{filter:brightness(1.12);transition-delay:.08s;}
.float--cube:hover .cube-right{filter:brightness(1.12);transition-delay:.16s;}

/* ============ 动效 ============ */
@keyframes float-bob{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(0,calc(var(--amp) * -1),0);}
}
@keyframes shadow-drift{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.26;}
  50%{transform:translate3d(0,calc(var(--amp) * .4px),0) scale(.94);opacity:.17;}
}

/* ============ 响应式 ============ */
@media (max-width:1023px){
  .hero-panel{border-radius:22px;padding:22px 16px 24px;}
  .float--ctrl,.float--chart,.float--data,.float--badge,.float--cube{--sc:.78;}
  .float--mini,.float--pill{display:none;}
  .nav-ext{display:none;}
  .tv-words-btn{font-size:10.2cqw;}
}
@media (max-width:639px){
  :root{--nav-h:52px;}
  .hero-wrap{padding:10px 8px 48px;min-height:calc(100svh - var(--nav-h));display:flex;align-items:center;}
  .hero-panel{border-radius:18px;padding:0;width:100%;}
  .float,.float-shadow{display:none;}
  .sticky-note{left:72%;top:20%;width:clamp(64px,20cqw,100px);padding:6px 8px;}
  .sticky-main{font-size:clamp(9px,4.4cqw,16px);}
  .sticky-sub{font-size:clamp(6px,2.8cqw,10px);}
  .name-badge{left:12%;top:82%;width:30%;height:6.5%;font-size:clamp(9px,3.6cqw,16px);letter-spacing:1px;}
  .user-note{left:46%;top:78%;width:24%;height:4.4%;font-size:clamp(6px,2.6cqw,10px);}
  .tv-words-btn{font-size:11.4cqw;padding-left:12%;}
  .brand-role{display:none;}
  .nav-links a[data-soon]:not(.nav-cta){display:none;}
  .nav-cta{margin-left:auto;padding:8px 14px;font-size:12px;}
}

/* ============ 无障碍 / 降级 ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
  .float,.float-shadow,.scene{transform:none!important;}
}
</style>
</head>
<body>

<a class="skip-link" href="#hero">跳到主要内容</a>

<header class="site-nav">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">F</span>
    <span class="brand-name">冯建燊</span>
    <span class="brand-role">新媒体运营 · 内容运营</span>
  </div>
  <nav class="nav-links" aria-label="主导航">
    <a href="#about" data-soon title="板块建设中">关于我</a>
    <a href="#data" data-soon title="板块建设中">数据</a>
    <a href="#method" data-soon title="板块建设中">方法论</a>
    <a href="#works" data-soon title="板块建设中">作品</a>
    <a href="#contact" data-soon title="板块建设中">联系</a>
    <a class="nav-cta" href="#contact" data-soon title="板块建设中">联系我</a>
  </nav>
</header>

<main id="hero">
  <div class="hero-wrap">
    <section class="hero-panel" aria-label="个人作品集首屏">
      <div class="tv-stage" id="tvStage">

        <!-- ============ 手绘 CRT 场景 ============ -->
        <div class="scene">
          <svg class="scene-art" viewBox="0 0 900 620" role="img" aria-labelledby="sceneTitle">
            <title id="sceneTitle">复古 CRT 电视样机：蓝色机身，屏幕显示 PORTFOLIO，桌面铺着网格纸、涂鸦小人与饮料罐，周围漂浮着立方体、键帽与数据卡片</title>
            <defs>
              <linearGradient id="tvBody" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#63B4F7"/><stop offset=".46" stop-color="#2E8BE0"/><stop offset="1" stop-color="#1B67B8"/>
              </linearGradient>
              <linearGradient id="domeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8CC9FA"/><stop offset="1" stop-color="#1E6FC4"/>
              </linearGradient>
              <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".42" stop-color="#fff" stop-opacity=".10"/>
                <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#C42C21"/><stop offset=".28" stop-color="#E63B2E"/>
                <stop offset=".62" stop-color="#F0574A"/><stop offset="1" stop-color="#B8271D"/>
              </linearGradient>
              <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
                <circle cx="4.5" cy="4.5" r="2" fill="#FFFFFF"/>
              </pattern>
              <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
                <rect width="4" height="1.4" fill="#FFFFFF" opacity=".055"/>
              </pattern>
              <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="skewY(-5)">
                <path d="M16 0H0V16" fill="none" stroke="#9CC9F0" stroke-width="1"/>
              </pattern>
              <clipPath id="tvClip"><rect x="175" y="110" width="490" height="370" rx="48"/></clipPath>
              <clipPath id="screenClip"><rect x="218" y="168" width="352" height="240" rx="24"/></clipPath>
              <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="4"/>
              </filter>
            </defs>

            <!-- 桌面台面 -->
            <path d="M8 468 H892 V612 H8 Z" fill="#FFFFFF" opacity=".46"/>
            <path d="M8 468 H892" stroke="#FFFFFF" stroke-width="3" opacity=".85"/>
            <ellipse cx="430" cy="476" rx="238" ry="12" fill="rgba(19,66,116,.2)" filter="url(#soft)"/>

            <!-- 电视投影 -->
            <ellipse cx="428" cy="502" rx="252" ry="16" fill="rgba(19,66,116,.22)" filter="url(#soft)"/>

            <!-- 机身右侧厚度面 -->
            <path d="M665 110 Q683 124 683 150 V442 Q683 468 665 480 Z" fill="#10477F"/>
            <path d="M665 110 Q676 122 679 142 V450 Q676 468 665 478 Z" fill="#0B3D6E"/>

            <!-- 机身主体 -->
            <rect x="175" y="110" width="490" height="370" rx="48" fill="url(#tvBody)"/>
            <g clip-path="url(#tvClip)">
              <!-- 顶部亮面 -->
              <path d="M175 110 H665 V150 Q420 132 175 152 Z" fill="#8CC9FA" opacity=".55"/>
              <!-- 底部暗面 -->
              <path d="M175 402 Q420 386 665 402 V480 H175 Z" fill="#175FB0" opacity=".85"/>
              <!-- 左上高光 -->
              <ellipse cx="268" cy="168" rx="124" ry="42" fill="#fff" opacity=".13"/>
              <path d="M175 110 H300 L215 200 H175 Z" fill="#fff" opacity=".08"/>
              <!-- 右下反光 -->

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ 屏幕文案切换：PORTFOLIO <-> NEW MEDIA ============ */
  var btn = $('#tvWordsBtn');
  var lines = btn ? btn.querySelectorAll('.tv-line') : [];
  var PAIRS = [['PORT','FOLIO'], ['NEW','MEDIA']];
  var mode = 0;
  if (btn){
    btn.addEventListener('click', function(){
      mode = (mode + 1) % PAIRS.length;
      btn.classList.add('is-fading');
      window.setTimeout(function(){
        for (var i = 0; i < lines.length; i++){ lines[i].textContent = PAIRS[mode][i]; }
        btn.classList.remove('is-fading');
      }, 200);
      btn.setAttribute('aria-label', '切换屏幕上的标题文案，当前为 ' + PAIRS[mode].join(' '));
    });
  }

  /* ============ 鼠标视差 ============ */
  var stage = $('#tvStage');
  if (stage && !REDUCED){
    var raf = null, tx = 0, ty = 0, cx = 0, cy = 0;
    function loop(){
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      stage.style.setProperty('--px', cx.toFixed(4));
      stage.style.setProperty('--py', cy.toFixed(4));
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
        raf = window.requestAnimationFrame(loop);
      } else {
        raf = null;
      }
    }
    function onMove(e){
      var r = stage.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - 0.5;
      ty = (e.clientY - r.top) / r.height - 0.5;
      if (!raf) raf = window.requestAnimationFrame(loop);
    }
    function onLeave(){
      tx = 0; ty = 0;
      if (!raf) raf = window.requestAnimationFrame(loop);
    }
    stage.addEventListener('mousemove', onMove);
    stage.addEventListener('mouseleave', onLeave);
  }
})();
</script>
