<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 上下左右四条光线 -->
  <rect x="7" y="1" width="2" height="3" fill="#ef8f2e"/>
  <rect x="7" y="12" width="2" height="3" fill="#ef8f2e"/>
  <rect x="1" y="7" width="3" height="2" fill="#ef8f2e"/>
  <rect x="12" y="7" width="3" height="2" fill="#ef8f2e"/>
  <!-- 四角斜光线 -->
  <rect x="3" y="3" width="2" height="2" fill="#ef8f2e"/>
  <rect x="11" y="3" width="2" height="2" fill="#ef8f2e"/>
  <rect x="3" y="11" width="2" height="2" fill="#ef8f2e"/>
  <rect x="11" y="11" width="2" height="2" fill="#ef8f2e"/>
  <!-- 圆盘：6x6 切角圆形 -->
  <rect x="6" y="5" width="4" height="1" fill="#f6c945"/>
  <rect x="5" y="6" width="6" height="4" fill="#f6c945"/>
  <rect x="6" y="10" width="4" height="1" fill="#f6c945"/>
  <!-- 左上高光 / 右下阴影 -->
  <rect x="6" y="6" width="1" height="1" fill="#ffe9a3"/>
  <rect x="9" y="9" width="1" height="1" fill="#d2701d"/>
</svg>
